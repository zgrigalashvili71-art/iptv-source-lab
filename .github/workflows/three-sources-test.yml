name: Build Separate IPTV Test Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone candidate repositories
        shell: bash
        run: |
          rm -rf candidates
          mkdir -p candidates
          git clone --depth=1 https://github.com/abyssscold/High-Stability-IPTV-Service.git candidates/high-stability || true
          git clone --depth=1 https://github.com/SHAJON-404/iptv.git candidates/shajon || true
          git clone --depth=1 https://github.com/LS-Station/IPTVPulse-Daily-Updates.git candidates/iptvpulse || true

      - name: Build AquaPlay-compatible test playlist
        shell: python
        run: |
          import json
          import re
          import urllib.request
          from pathlib import Path

          OUT = Path("THREE_SOURCES_TEST.m3u")
          REPORT = Path("THREE_SOURCES_TEST_REPORT.txt")

          # SHAJON's documented public JSON databases.
          remote_sources = [
              ("SHAJON Sports", "https://raw.githubusercontent.com/SHAJON-404/iptv-docs/main/app/data/sports.json"),
              ("SHAJON Universal", "https://raw.githubusercontent.com/SHAJON-404/iptv-docs/main/app/data/channels.json"),
          ]

          repo_dirs = [
              ("High-Stability", Path("candidates/high-stability")),
              ("SHAJON Repo", Path("candidates/shajon")),
              ("IPTVPulse", Path("candidates/iptvpulse")),
          ]

          BAD_DIRS = {".git", "node_modules", "dist", "build", "vendor", ".next"}
          BAD_FILES = {"package-lock.json", "package.json", "yarn.lock", "pnpm-lock.yaml", "bun.lockb"}

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 SeparateIPTVTest/1.0", "Accept": "*/*"},
              )
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read().decode("utf-8", errors="replace")

          def norm(s):
              return re.sub(r"\s+", " ", str(s or "")).strip()

          def special_or_restricted(d):
              keys = {str(k).lower() for k in d.keys()}
              vals = " ".join(str(v).lower() for v in d.values() if isinstance(v, (str, int, float, bool)))

              # Skip records that clearly need special handling which AquaPlay may not support
              # and which should not be used to bypass access controls.
              markers = [
                  "drm", "clearkey", "license", "widevine",
                  "proxy", "referer", "referrer", "origin",
                  "authorization", "bearer", "cookie", "headers"
              ]
              if any(any(m in k for m in markers) for k in keys):
                  return True
              if any(m in vals for m in ("widevine", "clearkey", "license_url")):
                  return True
              return False

          def get_name(d):
              for k in ("name", "title", "channel", "channel_name", "channelName", "label", "tvg-name"):
                  v = d.get(k)
                  if isinstance(v, str) and v.strip():
                      return norm(v)
              return ""

          def get_group(d):
              for k in ("group", "category", "group-title", "country", "region"):
                  v = d.get(k)
                  if isinstance(v, str) and v.strip():
                      return norm(v)
              return "Test"

          def get_url(d):
              preferred = ("url", "stream", "stream_url", "streamUrl", "src", "link", "source")
              for k in preferred:
                  v = d.get(k)
                  if isinstance(v, str) and v.lower().startswith(("http://", "https://")):
                      return v.strip()
              return ""

          entries = []
          skipped_special = 0
          seen_urls = set()
          stats = []

          def add_entry(name, group, url, source):
              if not name or not url:
                  return
              if not url.lower().startswith(("http://", "https://")):
                  return
              if url in seen_urls:
                  return
              seen_urls.add(url)
              entries.append((name, group, url, source))

          def walk_json(obj, source):
              nonlocal_skipped = [0]

              def walk(x):
                  nonlocal nonlocal_skipped
                  if isinstance(x, dict):
                      name = get_name(x)
                      url = get_url(x)
                      if name and url:
                          if special_or_restricted(x):
                              nonlocal_skipped[0] += 1
                          else:
                              add_entry(name, get_group(x), url, source)
                      for v in x.values():
                          walk(v)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v)

              walk(obj)
              return nonlocal_skipped[0]

          def parse_m3u(text, source):
              added_before = len(entries)
              pending = None
              group = "Test"

              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue

                  if line.upper().startswith("#EXTINF"):
                      pending = line.split(",", 1)[1].strip() if "," in line else "Unknown"
                      m = re.search(r'group-title="([^"]*)"', line, re.I)
                      group = m.group(1).strip() if m else "Test"
                      continue

                  if pending and not line.startswith("#"):
                      if line.lower().startswith(("http://", "https://")):
                          add_entry(pending, group, line, source)
                      pending = None
                      group = "Test"

              return len(entries) - added_before

          # 1) SHAJON documented JSON data
          for source_name, url in remote_sources:
              try:
                  text = fetch(url)
                  data = json.loads(text)
                  before = len(entries)
                  skipped = walk_json(data, source_name)
                  stats.append(f"{source_name}: added {len(entries)-before}, skipped special/restricted metadata {skipped}")
              except Exception as e:
                  stats.append(f"{source_name}: FAILED ({type(e).__name__}: {e})")

          # 2) Actual playlist files found in the three repos
          for source_name, root in repo_dirs:
              if not root.exists():
                  stats.append(f"{source_name}: repo unavailable")
                  continue

              before_repo = len(entries)
              files_seen = 0

              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  if any(part in BAD_DIRS for part in p.parts):
                      continue
                  if p.name in BAD_FILES:
                      continue

                  if p.suffix.lower() in {".m3u", ".m3u8"}:
                      try:
                          text = p.read_text(encoding="utf-8", errors="replace")
                      except Exception:
                          continue
                      files_seen += 1
                      parse_m3u(text, f"{source_name}:{p.relative_to(root)}")

              stats.append(f"{source_name}: playlist files {files_seen}, added {len(entries)-before_repo}")

          # Write one separate playlist for AquaPlay
          lines = ["#EXTM3U"]
          for name, group, url, source in entries:
              safe_name = name.replace('"', "'")
              safe_group = group.replace('"', "'")
              safe_source = source.replace('"', "'")
              lines.append(
                  f'#EXTINF:-1 group-title="{safe_group}" tvg-source="{safe_source}",{safe_name}'
              )
              lines.append(url)

          OUT.write_text("\n".join(lines) + "\n", encoding="utf-8")

          REPORT.write_text(
              "THREE SOURCES TEST REPORT\n"
              "=========================\n"
              + "\n".join(stats)
              + f"\n\nTOTAL TEST ENTRIES: {len(entries)}\n"
              + "\nNotes:\n"
              + "- This test playlist is separate from your V2 playlist.\n"
              + "- It keeps direct HTTP/HTTPS entries that look AquaPlay-compatible.\n"
              + "- It skips records that explicitly indicate DRM, auth headers, cookies, proxy, referer/origin, or license handling.\n"
              + "- It does not prove a stream is authorized, stable, or available in your region.\n",
              encoding="utf-8",
          )

          if not entries:
              raise RuntimeError("No AquaPlay-compatible direct entries were found.")

      - name: Remove cloned repos
        shell: bash
        run: rm -rf candidates

      - name: Commit separate test playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THREE_SOURCES_TEST.m3u THREE_SOURCES_TEST_REPORT.txt
          git diff --cached --quiet && echo "No changes." || (git commit -m "Update separate IPTV test playlist" && git push)
