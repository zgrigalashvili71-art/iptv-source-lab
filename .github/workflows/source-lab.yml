name: IPTV Source Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout this lab repo
        uses: actions/checkout@v4

      - name: Clone candidate repositories
        shell: bash
        run: |
          set -e
          rm -rf candidates
          mkdir -p candidates

          git clone --depth=1 https://github.com/abyssscold/High-Stability-IPTV-Service.git candidates/high-stability || true
          git clone --depth=1 https://github.com/SHAJON-404/iptv.git candidates/shajon || true
          git clone --depth=1 https://github.com/LS-Station/IPTVPulse-Daily-Updates.git candidates/iptvpulse || true

      - name: Analyze candidate sources
        shell: python
        run: |
          import json
          import re
          import socket
          import ssl
          import subprocess
          import urllib.error
          import urllib.request
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlparse

          ROOT = Path("candidates")
          OUT = Path("reports")
          OUT.mkdir(exist_ok=True)

          # Current V2 master playlist, used ONLY for overlap comparison.
          CURRENT_V2 = "https://raw.githubusercontent.com/zgrigalashvili71-art/-mega-iptv/main/ALL_TV_PLUS_SPORTS.m3u"

          REPOS = [
              ("High-Stability-IPTV-Service", ROOT / "high-stability"),
              ("SHAJON-404 IPTV", ROOT / "shajon"),
              ("IPTVPulse-Daily-Updates", ROOT / "iptvpulse"),
          ]

          TEXT_EXTS = {
              ".m3u", ".m3u8", ".txt", ".json", ".js", ".ts", ".tsx",
              ".md", ".yaml", ".yml", ".csv", ".conf", ".ini"
          }

          URL_RE = re.compile(r'https?://[^\s\'"<>]+', re.I)
          EXTINF_RE = re.compile(r'^\s*#EXTINF', re.I | re.M)

          def read_text(path, max_bytes=8_000_000):
              try:
                  if path.stat().st_size > max_bytes:
                      return ""
                  return path.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  return ""

          def urls_from_text(text):
              urls = []
              for u in URL_RE.findall(text):
                  # Trim punctuation commonly captured at line/end delimiters.
                  u = u.rstrip("),.;]}\\")
                  urls.append(u)
              return urls

          def streamish(url):
              low = url.lower()
              return (
                  ".m3u8" in low or ".m3u" in low or ".mpd" in low or
                  low.startswith("rtmp://") or low.startswith("rtsp://") or
                  "/live/" in low or "/stream" in low or "playlist" in low
              )

          def host(url):
              try:
                  return urlparse(url).netloc.lower()
              except Exception:
                  return ""

          def load_current_urls():
              try:
                  req = urllib.request.Request(
                      CURRENT_V2,
                      headers={"User-Agent": "Mozilla/5.0 IPTVSourceLab/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=35) as r:
                      text = r.read().decode("utf-8", errors="replace")
                  return {
                      line.strip() for line in text.splitlines()
                      if line.strip().lower().startswith(("http://", "https://", "rtmp://", "rtsp://"))
                  }
              except Exception as e:
                  print("Could not load current V2 for overlap comparison:", e)
                  return set()

          def probe_http(url, timeout=7):
              # Lightweight probe only. No auth, cookies, DRM keys, geo bypass,
              # proxying, credential use, or access-control circumvention.
              if not url.lower().startswith(("http://", "https://")):
                  return "NON_HTTP"

              headers = {
                  "User-Agent": "Mozilla/5.0 IPTVSourceLab/1.0",
                  "Accept": "*/*",
                  "Range": "bytes=0-2047",
              }
              req = urllib.request.Request(url, headers=headers, method="GET")
              ctx = ssl.create_default_context()

              try:
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                      code = getattr(r, "status", 200)
                      ctype = (r.headers.get("Content-Type") or "").lower()
                      data = r.read(2048)
                      text = data.decode("utf-8", errors="ignore").lower()

                      if code in (200, 206):
                          if "#extm3u" in text or "application/vnd.apple.mpegurl" in ctype or "application/x-mpegurl" in ctype:
                              return "HLS_OK"
                          if "application/dash+xml" in ctype or "<mpd" in text:
                              return "DASH_OK"
                          if "video/" in ctype or "application/octet-stream" in ctype:
                              return "MEDIA_OK"
                          return f"HTTP_{code}"
                      return f"HTTP_{code}"
              except urllib.error.HTTPError as e:
                  if e.code in (401, 403):
                      return f"AUTH_OR_RESTRICTED_{e.code}"
                  if e.code == 404:
                      return "DEAD_404"
                  if 300 <= e.code < 400:
                      return f"REDIRECT_{e.code}"
                  return f"HTTP_ERROR_{e.code}"
              except urllib.error.URLError as e:
                  msg = str(e.reason).lower()
                  if "timed out" in msg:
                      return "TIMEOUT"
                  if "ssl" in msg or "certificate" in msg:
                      return "TLS_ERROR"
                  return "NETWORK_ERROR"
              except socket.timeout:
                  return "TIMEOUT"
              except Exception:
                  return "ERROR"

          current_urls = load_current_urls()
          combined_rows = []

          for repo_name, repo_path in REPOS:
              print(f"\n===== {repo_name} =====")
              if not repo_path.exists():
                  report = f"# {repo_name}\n\nRepository could not be cloned.\n"
                  (OUT / (repo_name.replace(" ", "_") + ".md")).write_text(report, encoding="utf-8")
                  combined_rows.append((repo_name, 0, 0, 0, 0, "clone failed"))
                  continue

              candidate_files = []
              all_urls = []
              extinf_files = 0

              for p in repo_path.rglob("*"):
                  if not p.is_file():
                      continue
                  if ".git" in p.parts:
                      continue
                  if p.suffix.lower() not in TEXT_EXTS:
                      continue

                  text = read_text(p)
                  if not text:
                      continue

                  urls = urls_from_text(text)
                  extinf_count = len(EXTINF_RE.findall(text))
                  stream_urls = [u for u in urls if streamish(u)]

                  if extinf_count or stream_urls:
                      rel = p.relative_to(repo_path)
                      candidate_files.append({
                          "file": str(rel),
                          "extinf": extinf_count,
                          "urls": len(urls),
                          "streamish_urls": len(stream_urls),
                      })
                      if extinf_count:
                          extinf_files += 1

                  all_urls.extend(stream_urls)

              unique_urls = list(dict.fromkeys(all_urls))
              overlap = [u for u in unique_urls if u in current_urls]
              new_vs_v2 = [u for u in unique_urls if u not in current_urls]

              # Probe a deterministic sample: first 40 unique stream-like URLs.
              sample = unique_urls[:40]
              status_counts = Counter()
              host_counts = Counter()

              for u in sample:
                  status = probe_http(u)
                  status_counts[status] += 1
                  h = host(u)
                  if h:
                      host_counts[h] += 1

              success = sum(
                  status_counts[k]
                  for k in ("HLS_OK", "DASH_OK", "MEDIA_OK", "HTTP_200", "HTTP_206")
              )
              tested = len(sample)
              success_pct = round((success / tested * 100), 1) if tested else 0.0

              # Do not publish stream URLs in reports. Only counts, filenames,
              # domains and probe classifications are written.
              lines = [
                  f"# {repo_name}",
                  "",
                  "## Inventory",
                  f"- Candidate files: **{len(candidate_files)}**",
                  f"- Files containing #EXTINF entries: **{extinf_files}**",
                  f"- Unique stream-like URLs discovered: **{len(unique_urls)}**",
                  f"- Exact URL overlap with current V2: **{len(overlap)}**",
                  f"- URLs not already present in V2: **{len(new_vs_v2)}**",
                  "",
                  "## Lightweight reachability sample",
                  f"- URLs tested: **{tested}**",
                  f"- Immediately reachable/media-like: **{success} ({success_pct}%)**",
                  "",
                  "### Probe results",
              ]

              for status, count in status_counts.most_common():
                  lines.append(f"- {status}: {count}")

              lines += ["", "### Most common source domains in tested sample"]
              for h, count in host_counts.most_common(15):
                  lines.append(f"- `{h}`: {count}")

              lines += [
                  "",
                  "## Candidate files",
                  "",
                  "| File | EXTINF entries | URLs | Stream-like URLs |",
                  "|---|---:|---:|---:|",
              ]
              for row in sorted(candidate_files, key=lambda x: (x["streamish_urls"], x["extinf"]), reverse=True)[:80]:
                  lines.append(
                      f'| `{row["file"]}` | {row["extinf"]} | {row["urls"]} | {row["streamish_urls"]} |'
                  )

              lines += [
                  "",
                  "## Interpretation",
                  "- `HLS_OK`, `DASH_OK`, or `MEDIA_OK` means the endpoint responded like playable media during a small probe.",
                  "- `AUTH_OR_RESTRICTED_401/403` may require legitimate authorization, regional availability, headers, or another provider requirement.",
                  "- `DEAD_404`, `TIMEOUT`, `TLS_ERROR`, and `NETWORK_ERROR` reduce reliability.",
                  "- This test does not bypass DRM, authentication, subscription checks, geo-restrictions, CORS, or other access controls.",
                  "- A high count does not automatically mean a better source; stability and compatibility matter more than raw channel count.",
                  "",
              ]

              report_file = OUT / (repo_name.replace(" ", "_").replace("/", "_") + ".md")
              report_file.write_text("\n".join(lines), encoding="utf-8")

              combined_rows.append((
                  repo_name,
                  len(candidate_files),
                  len(unique_urls),
                  len(new_vs_v2),
                  success_pct,
                  ", ".join(f"{k}:{v}" for k, v in status_counts.most_common(4))
              ))

          summary = [
              "# IPTV Candidate Source Lab",
              "",
              "This repository tests the three candidate GitHub projects separately before anything is merged into the main V2 playlist.",
              "",
              "| Source | Candidate files | Unique stream-like URLs | New vs V2 | Sample reachable % | Main probe outcomes |",
              "|---|---:|---:|---:|---:|---|",
          ]

          for row in combined_rows:
              summary.append(
                  f"| {row[0]} | {row[1]} | {row[2]} | {row[3]} | {row[4]}% | {row[5]} |"
              )

          summary += [
              "",
              "## What this lab does",
              "- Clones each candidate repository independently.",
              "- Finds playlist/database-like files and stream-like URLs.",
              "- Compares exact stream URLs against the existing V2 playlist.",
              "- Performs a small, lightweight reachability/media probe.",
              "- Keeps the repositories separate so a bad source cannot damage the existing V2 playlist.",
              "",
              "## What this lab deliberately does not do",
              "- It does not publish or merge extracted stream URLs.",
              "- It does not use credentials or leaked accounts.",
              "- It does not bypass DRM, subscription checks, regional controls, authentication, or other access controls.",
              "",
              "Review the per-source reports in `/reports` before deciding whether any source belongs in the main playlist.",
              "",
          ]

          Path("SOURCE_LAB_REPORT.md").write_text("\n".join(summary), encoding="utf-8")

      - name: Remove cloned repositories before commit
        shell: bash
        run: rm -rf candidates

      - name: Commit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_LAB_REPORT.md reports/
          git diff --cached --quiet && echo "No report changes." || (git commit -m "Update IPTV source lab report" && git push)
